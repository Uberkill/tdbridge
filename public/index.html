<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TD Bridge</title>
    <!-- Google Fonts: Roboto for Material Design -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    <!-- NippleJS for mobile virtual joystick -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>
    <!-- Material Design Onboarding Gate -->
    <div id="gate">
        <div class="mat-card mat-elevation-z2">
            <h1>TD Bridge</h1>
            <p id="error-msg" style="color: var(--error); margin-bottom: 10px;"></p>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="Your Name" maxlength="12" autocomplete="off" spellcheck="false">
            </div>
            <div class="input-group">
                <input type="text" id="room-code-input" placeholder="Room Code (e.g. 8XF2)" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" style="text-transform: uppercase;">
            </div>
            <button id="join-btn" class="mat-btn mat-primary">Connect</button>
        </div>
    </div>

    <!-- The Actual Controller UI -->
    <div id="ui" style="display: none;">
        <div id="status-bar" class="mat-elevation-z2">
            <span id="slot-indicator">Connecting...</span>
            <button id="exit-btn" class="mat-btn mat-secondary">Leave</button>
        </div>
        
        <div id="control-area">
            <!-- Joystick occupies upper/left space -->
            <div id="joystick-zone"></div>
            
            <!-- Action buttons with descriptions -->
            <div id="dynamic-controls" class="controls-grid"></div>
        </div>
    </div>

    <script src="app.js?v=4"></script>
</body>
</html>
